name: build-pack
on:
  push:
    paths: ['build.py', 'sprites.py', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python build.py
      - run: |
          git config user.name "pack-bot"
          git config user.email "pack-bot@users.noreply.github.com"
          git add OlympianTrials-Pack.zip
          git commit -m "Build texture pack" || echo "no changes"
          git push
